name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-os:
    name: Build ${{ matrix.platform }}
    # The cached LLVM toolchain links libxml2.so.2 and needs glibc 2.38, which
    # ubuntu-24.04 has; ubuntu-latest moved to 26.04 without libxml2.so.2.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x86_64
            artifact: zedbsd-x86_64.img.gz
          - platform: rpi4
            artifact: zedbsd-rpi4.img.gz
          - platform: rpi5
            artifact: zedbsd-rpi5.img.gz
          - platform: vf2
            artifact: zedbsd-vf2.img.gz
          - platform: macppc32
            artifact: zedbsd-macppc32.img.gz
          - platform: pc9821
            artifact: zedbsd-pc9821.img.gz
          - platform: pc9801ns
            artifact: zedbsd-pc9801ns.img.gz
    env:
      PLATFORM: ${{ matrix.platform }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The platform's defaults.mk alone: an empty file in place of the
      # developer's config.mk.
      - name: Build with the platform's defaults
        run: |
          : > "$RUNNER_TEMP/defaults-only.mk"
          echo "CONFIGMK=$RUNNER_TEMP/defaults-only.mk" >> "$GITHUB_ENV"

      - name: Set up dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake curl device-tree-compiler dosfstools e2fsprogs git grub-common gzip \
            mtools nasm ninja-build patch python3 xz-utils

      # The build is made and tested with GNU make 4.4.1; the runner has 4.3.
      - name: Install GNU make 4.4.1
        run: |
          curl -fsSL https://ftp.gnu.org/gnu/make/make-4.4.1.tar.gz -o "$RUNNER_TEMP/make.tar.gz"
          echo "dd16fb1d67bfab79a72f5e8390735c49e3e8e70b4945a15ab1f81ddb78658fb3  $RUNNER_TEMP/make.tar.gz" | sha256sum -c
          tar -xzf "$RUNNER_TEMP/make.tar.gz" -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/make-4.4.1"
          ./configure --prefix=/usr/local --without-guile > /dev/null
          make -j4 > /dev/null
          sudo make install > /dev/null
          hash -r
          make --version | head -n 1

      - name: Install the pinned toolchain from its cache
        run: |
          make PLATFORM="$PLATFORM" CONFIGMK="$CONFIGMK" toolchain-cached
          make PLATFORM="$PLATFORM" CONFIGMK="$CONFIGMK" toolchain

      - name: Accept the firmware licenses
        run: yes | make PLATFORM="$PLATFORM" CONFIGMK="$CONFIGMK" firmware-licenses

      - name: Build the disk image
        run: make -j4 PLATFORM="$PLATFORM" CONFIGMK="$CONFIGMK" disk

      - name: Compress the disk image
        run: |
          mkdir -p artifacts
          gzip -9 -c "build/${{ matrix.platform }}/hdd-image.img" > "artifacts/${{ matrix.artifact }}"

      - name: Upload the disk image
        uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.platform }}
          path: artifacts/${{ matrix.artifact }}

      # The installer's network install takes the system from the release's
      # asset zedbsd-system-x86_64.tar: ustar, not compressed, of what
      # mk/tools/installer-units.py writes (index, boot/ and units/), with the
      # image's loader, kernel and logo.  The image's root is cut into two
      # units: firmware, the files under /lib/firmware and the licences of
      # the firmware packages (their registrations in userland/firmware),
      # which the installer asks the person to agree to or leave out; and
      # base, the rest.  The units are the build's VERSION, their files
      # dated by the commit.
      - name: Make the installer's system tarball
        if: matrix.platform == 'x86_64'
        run: |
          build="build/$PLATFORM"
          work="$RUNNER_TEMP/installer"
          mkdir -p "$work" system
          version=$(make -s --no-print-directory PLATFORM="$PLATFORM" CONFIGMK="$CONFIGMK" \
            --eval 'ci-version: ; @echo $(VERSION)' ci-version | tail -n 1)
          test -n "$version"
          mtime=$(git log -1 --format=%ct)
          firmware=$(sed -n 's/.*call USERLAND_PACKAGE,\([^,]*\),.*/\1/p' userland/firmware/*/Makefile)
          (cd "$build/rootfs" && find . -mindepth 1 ! -path ./.stamp \( -type f -o -type l \) \
            -printf '%P\tbase\t-\t%y\t%m\n') |
            awk -F '\t' -v OFS='\t' -v names="$firmware" '
              BEGIN { count = split(names, name, " "); for (i = 1; i <= count; i++) licence["usr/share/licenses/" name[i]] = 1 }
              { split($1, part, "/") }
              $1 ~ /^lib\/firmware\// || (part[1] "/" part[2] "/" part[3] "/" part[4]) in licence { $2 = "firmware" }
              { print }' > "$work/manifest"
          awk -F '\t' '$2 == "firmware" { found = 1 } END { exit !found }' "$work/manifest"
          : > "$work/owners"
          printf '%s\t%s\t%s\t%s\t%s\n' base - required 'Base System' base firmware - on Firmware firmware \
            other - off 'Other packages' - > "$work/items"
          python3 mk/tools/make-boot-splash.py userland/desktop/artwork/zedbsd-boot-splash.png "$work/logo.ppm"
          python3 mk/tools/installer-units.py --manifest "$work/manifest" --owners "$work/owners" \
            --tree "$build/rootfs" --items "$work/items" --version "$version" --mtime "$mtime" \
            --boot "BOOTX64.EFI=esp:/EFI/BOOT/BOOTX64.EFI=$build/uefi/BOOTX64.EFI" \
            --boot "vmunix=/boot/vmunix=$build/vmunix" \
            --boot "logo.ppm=/boot/logo.ppm=$work/logo.ppm" \
            --output "$work/payload"
          tar --format=ustar --owner=0 --group=0 --numeric-owner --mode=go-w --mtime="@$mtime" --sort=name \
            -cf system/zedbsd-system-x86_64.tar -C "$work/payload" index boot units
          ls -l system/zedbsd-system-x86_64.tar

      - name: Upload the installer's system tarball
        if: matrix.platform == 'x86_64'
        uses: actions/upload-artifact@v4
        with:
          name: system-x86_64
          path: system/zedbsd-system-x86_64.tar
          if-no-files-found: error

  build-apps:
    name: Build mikuterm
    runs-on: ubuntu-24.04
    env:
      LLVM_MINGW_TAG: "20261104"
      LLVM_MINGW_NAME: "llvm-mingw-20261104-ucrt-ubuntu-22.04-x86_64"
      LLVM_MINGW_SHA256: "919380403de87dca3c581c2053230cd298af5e891286628ba0613b7fed370926"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake curl ninja-build python3 xz-utils

      - name: Install llvm-mingw
        run: |
          curl -fsSL "https://github.com/mstorsjo/llvm-mingw/releases/download/$LLVM_MINGW_TAG/$LLVM_MINGW_NAME.tar.xz" \
            -o "$RUNNER_TEMP/llvm-mingw.tar.xz"
          echo "$LLVM_MINGW_SHA256  $RUNNER_TEMP/llvm-mingw.tar.xz" | sha256sum -c
          tar -xJf "$RUNNER_TEMP/llvm-mingw.tar.xz" -C "$RUNNER_TEMP"
          echo "LLVM_MINGW=$RUNNER_TEMP/$LLVM_MINGW_NAME" >> "$GITHUB_ENV"

      # CMake takes the toolchain file by its absolute path.
      - name: Build
        run: |
          cmake -S apps/terminal-win32 -B build/mikuterm-x64 -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/apps/terminal-win32/cmake/llvm-mingw-x86_64.cmake" \
            -DLLVM_MINGW="$LLVM_MINGW"
          cmake --build build/mikuterm-x64 --target zip -j4

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: mikuterm-win64
          path: build/mikuterm-x64/mikuterm-*-win64.zip
          if-no-files-found: error

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    needs:
      - build-os
      - build-apps
    steps:
      - name: Download the disk images
        uses: actions/download-artifact@v4
        with:
          pattern: image-*
          merge-multiple: true
          path: artifacts

      - name: Download the installer's system tarballs
        uses: actions/download-artifact@v4
        with:
          pattern: system-*
          merge-multiple: true
          path: artifacts

      - name: Download the apps
        uses: actions/download-artifact@v4
        with:
          pattern: mikuterm-*
          merge-multiple: true
          path: app-artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: nightly-${{ github.run_number }}
          name: Nightly Build ${{ github.run_number }}
          prerelease: true

          body: |
            This is an automated nightly build. Not an official release.
            
            zedBSD OS
            =========
            
            Mainline Targets (Wayland):
            | Image          | CPU     | Machine          | File                     | Description   |
            |----------------|---------|------------------|--------------------------|---------------|
            | x86_64         | x86_64  | UEFI PC          | `zedbsd-x86_64.img.gz`   | USB image     |
            | Raspberry Pi 4 | Arm64   | Raspberry Pi 4   | `zedbsd-rpi4.img.gz`     | SD image      |
            | Raspberry Pi 5 | Arm64   | Raspberry Pi 5   | `zedbsd-rpi5.img.gz`     | SD image      |
            | VisionFive 2   | RISC-V  | VisionFive 2     | `zedbsd-vf2.img.gz`      | SD image      |

            The installer of the x86_64 image installs `zedbsd-system-x86_64.tar` of a release that is not a prerelease.
            
            Retro Targets (X11 or console-only):
            | Image          | CPU     | Machine          | File                     | Description                   |
            |----------------|---------|------------------|--------------------------|-------------------------------|
            | pc9801ns       | i386SX  | PC-9801NS/20     | `zedbsd-pc9801ns.img.gz` | IDE image (Head=4, Sector=17) |
            | pc9821         | i486DX  | PC-9821          | `zedbsd-pc9821.img.gz`   | IDE image (Head=8, Sector=17) |
            | macppc32       | PowerPC | PowerPC Mac (G4) | `zedbsd-macppc32.img.gz` | USB image [(How to boot)](https://github.com/awemorris/zedBSD/blob/main/docs/howto/powermac-boot.md) |
            
            Windows-ported Apps:
            | Name        | OS                | Description                                       |
            |-------------|-------------------|---------------------------------------------------|
            | mikuterm    | Windows 11 x64    | SSH Terminal for Windows (Micro Unicode Terminal) |

          files: |
            artifacts/*.img.gz
            artifacts/zedbsd-system-*.tar
            app-artifacts/*.zip
