name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x86_64
            artifact: zedbsd-x86_64.img.gz
          - platform: rpi4
            artifact: zedbsd-rpi4.img.gz
          - platform: rpi5
            artifact: zedbsd-rpi5.img.gz
          - platform: vf2
            artifact: zedbsd-vf2.img.gz
    env:
      CONFIGMK: config/config.${{ matrix.platform }}.mk
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake curl device-tree-compiler dosfstools e2fsprogs git grub-common gzip \
            mtools nasm ninja-build patch python3 xz-utils

      - name: Install the pinned toolchain from its cache
        run: make CONFIGMK="$CONFIGMK" toolchain-cached

      - name: Accept the firmware licenses
        run: yes | make CONFIGMK="$CONFIGMK" firmware-licenses

      - name: Build the disk image
        run: make -j4 CONFIGMK="$CONFIGMK" disk

      - name: Compress the disk image
        run: |
          mkdir -p artifacts
          gzip -9 -c "build/${{ matrix.platform }}/hdd-image.img" > "artifacts/${{ matrix.artifact }}"

      - name: Upload the disk image
        uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.platform }}
          path: artifacts/${{ matrix.artifact }}

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    needs:
      - build
    steps:
      - name: Download the disk images
        uses: actions/download-artifact@v4
        with:
          pattern: image-*
          merge-multiple: true
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: nightly-${{ github.run_number }}
          name: Nightly Build ${{ github.run_number }}
          prerelease: true

          body: |
            This is an automated nightly build. Not an official release.

            zedBSD OS
            =========

            | Image        | CPU     | Machine        | File                   | Description |
            |--------------|---------|----------------|------------------------|-------------|
            | x86_64       | x86_64  | UEFI PC        | `zedbsd-x86_64.img.gz` | USB image   |
            | Raspberry Pi 4 | Arm64 | Raspberry Pi 4 | `zedbsd-rpi4.img.gz`   | SD image    |
            | Raspberry Pi 5 | Arm64 | Raspberry Pi 5 | `zedbsd-rpi5.img.gz`   | SD image    |
            | VisionFive 2 | RISC-V  | VisionFive 2   | `zedbsd-vf2.img.gz`    | SD image    |
          files: artifacts/*.img.gz
