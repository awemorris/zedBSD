name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-os:
    name: Build ${{ matrix.platform }}
    # The cached LLVM toolchain links libxml2.so.2 and needs glibc 2.38, which
    # ubuntu-24.04 has; ubuntu-latest moved to 26.04 without libxml2.so.2.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x86_64
            artifact: zedbsd-x86_64.img.gz
          - platform: rpi4
            artifact: zedbsd-rpi4.img.gz
          - platform: rpi5
            artifact: zedbsd-rpi5.img.gz
          - platform: vf2
            artifact: zedbsd-vf2.img.gz
          - platform: macppc32
            artifact: zedbsd-macppc32.img.gz
          - platform: pc9821
            artifact: zedbsd-pc9821.img.gz
          - platform: pc9801ns
            artifact: zedbsd-pc9801ns.img.gz
    env:
      CONFIGMK: config/config.${{ matrix.platform }}.mk
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake curl device-tree-compiler dosfstools e2fsprogs git grub-common gzip \
            mtools nasm ninja-build patch python3 xz-utils

      # The Makefile uses .WAIT, which needs GNU make 4.4 or later; the runner has 4.3.
      - name: Install GNU make 4.4.1
        run: |
          curl -fsSL https://ftp.gnu.org/gnu/make/make-4.4.1.tar.gz -o "$RUNNER_TEMP/make.tar.gz"
          echo "dd16fb1d67bfab79a72f5e8390735c49e3e8e70b4945a15ab1f81ddb78658fb3  $RUNNER_TEMP/make.tar.gz" | sha256sum -c
          tar -xzf "$RUNNER_TEMP/make.tar.gz" -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/make-4.4.1"
          ./configure --prefix=/usr/local --without-guile > /dev/null
          make -j4 > /dev/null
          sudo make install > /dev/null
          hash -r
          make --version | head -n 1

      - name: Install the pinned toolchain from its cache
        run: |
          make CONFIGMK="$CONFIGMK" toolchain-cached
          make CONFIGMK="$CONFIGMK" toolchain

      - name: Accept the firmware licenses
        run: yes | make CONFIGMK="$CONFIGMK" firmware-licenses

      - name: Build the disk image
        run: make -j4 CONFIGMK="$CONFIGMK" disk

      - name: Compress the disk image
        run: |
          mkdir -p artifacts
          gzip -9 -c "build/${{ matrix.platform }}/hdd-image.img" > "artifacts/${{ matrix.artifact }}"

      - name: Upload the disk image
        uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.platform }}
          path: artifacts/${{ matrix.artifact }}

  build-apps:
    name: Build ${{ matrix.platform }}
    runs-on: ubuntu-latest
    env:
      LLVM_MINGW_TAG: "20261104"
      LLVM_MINGW_NAME: "llvm-mingw-20261104-ucrt-ubuntu-22.04-x86_64"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build
        run: |
          cmake -S apps/terminal-win32 -B build/mikuterm-x64 -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_TOOLCHAIN_FILE=cmake/llvm-mingw-x86_64.cmake -DLLVM_MINGW=/opt/llvm-mingw-20261104-ucrt-ubuntu-22.04-x86_64
          cmake --build build/mikuterm-x64 --target zip -j4

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: build/mikuterm-x64/mikuterm-0.1.0-win64.zip
          path: app-artifacts/mikuterm-0.1.0-win64.zip

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    needs:
      - build-os
      - build-apps
    steps:
      - name: Download the disk images
        uses: actions/download-artifact@v4
        with:
          pattern: image-*
          merge-multiple: true
          path: artifacts

      - name: Download the apps
        uses: actions/download-artifact@v4
        with:
          pattern: miterm-*
          merge-multiple: true
          path: app-artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: nightly-${{ github.run_number }}
          name: Nightly Build ${{ github.run_number }}
          prerelease: true

          body: |
            This is an automated nightly build. Not an official release.
            
            zedBSD OS
            =========
            
            Mainline Targets (Wayland):
            | Image          | CPU     | Machine          | File                     | Description   |
            |----------------|---------|------------------|--------------------------|---------------|
            | x86_64         | x86_64  | UEFI PC          | `zedbsd-x86_64.img.gz`   | USB image     |
            | Raspberry Pi 4 | Arm64   | Raspberry Pi 4   | `zedbsd-rpi4.img.gz`     | SD image      |
            | Raspberry Pi 5 | Arm64   | Raspberry Pi 5   | `zedbsd-rpi5.img.gz`     | SD image      |
            | VisionFive 2   | RISC-V  | VisionFive 2     | `zedbsd-vf2.img.gz`      | SD image      |
            
            Retro Targets (X11 or console-only):
            | Image          | CPU     | Machine          | File                     | Description                   |
            |----------------|---------|------------------|--------------------------|-------------------------------|
            | pc9801ns       | i386SX  | PC-9801NS/20     | `zedbsd-pc9801ns.img.gz` | IDE image (Head=4, Sector=17) |
            | pc9821         | i486DX  | PC-9821          | `zedbsd-pc9821.img.gz`   | IDE image (Head=8, Sector=17) |
            | macppc32       | PowerPC | PowerPC Mac (G4) | `zedbsd-macppc32.img.gz` | USB image [(How to boot)](https://github.com/awemorris/zedBSD/blob/main/docs/howto/powermac-boot.md) |
            
            Windows-ported Apps:
            | Name        | OS                | Description                                       |
            |-------------|-------------------|---------------------------------------------------|
            | mikuterm    | Windows 11 x64    | SSH Terminal for Windows (Micro Unicode Terminal) |

          files: |
            - artifacts/*.img.gz
            - app-artifacts/*.zip
