version: 1
hostname: zedbsd

services:
  audiod:
    enabled: true
    optional: true
  # The Bluetooth daemon (ws143), in the images that carry it.  On an install
  # whose /etc/passwd has no _bluetooth account it logs so and does not start.
  bluetoothd:
    enabled: true
    optional: true
  # Keeps each boot's kernel log in /boot/boot0/log on the boot FAT (BUG-288),
  # in the images that carry it (the Raspberry Pi 4's).  It writes a few times
  # per boot and does nothing when /boot/boot0 is not a FAT volume.
  bootlog:
    enabled: true
    optional: true
  cron:
    enabled: true
  getty_console:
    enabled: true
  # The home directories /etc/passwd names under /home that are missing are
  # made at boot (ws129-p004), for a login before a graphical session.
  homes:
    enabled: true
  # The PowerVR stage test at boot (ws269-p010a), only in the VisionFive 2 test
  # images that select gpu-selftest-boot; it writes one line a stage on the
  # console and ends.
  gpu_selftest:
    enabled: true
    optional: true
  # The graphical login (sessiond, amd64 images with the compositor).  It stands in
  # for getty_console when the boot parameters say login=graphical and the
  # machine has a display; otherwise it ends at once and getty_console starts.
  greeter:
    enabled: true
    optional: true
  # Sets the clock from the network after networking (BUG-320), in the images
  # that carry it (the Raspberry Pi 4's, which has no clock of its own).  It
  # asks pool.ntp.org in the background, again every 10 seconds for about ten
  # minutes until one answers, so a boot without the network does not wait.
  netclock:
    enabled: true
    optional: true
  networkd:
    enabled: true
  networking:
    enabled: true
    settings:
      # Whether the boot waits for an interface to be given an address it
      # can be reached at.  A machine whose next step needs the network
      # says true here; one that does not need not stand still for a
      # server that may not be there.  A link-local address is not one a
      # machine can be reached at, so it does not end the wait.
      wait: "false"
  ntpdate:
    enabled: false
    settings:
      servers: ""
  sshd:
    enabled: true
    optional: true
  syslogd:
    enabled: true
  # Gives the kernel the heat and power strategy last chosen with /sbin/thermal
  # (kept in /etc/thermal.conf), or balanced, once at boot.
  thermal:
    enabled: true
    optional: true
  # The removable media daemon (ws132-p004): lists USB storage and mounts it under /media
  # when the session's user asks, never by itself.
  volumed:
    enabled: true
    optional: true
