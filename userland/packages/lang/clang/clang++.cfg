# The options clang++ reads before its own (the driver's default configuration
# file, found beside the program).  The zedBSD driver names no C++ library of
# its own: the C++ runtime's headers are searched before the C library's, and
# a link takes libc++ with the ABI library and the unwinder it is built on.
# The linker does not care about the order of shared libraries, so they may
# come before the objects.
-isystem /usr/include/c++/v1
-lc++
-lc++abi
-lunwind
