version: 1
hostname: zedbsd

# WS031 p014: the model viewer on the i915 capture display (zdesktop + mview; the harness sends the input).
services:
  cron:
    enabled: false
  getty_console:
    enabled: true
  net:
    enabled: false
  networkd:
    enabled: false
  ntpdate:
    enabled: false
    settings:
      servers: ""
  syslogd:
    enabled: true
  vkwait1:
    enabled: true
  zdesktop:
    enabled: true
  wlwait:
    enabled: true
  mview1:
    enabled: true
  vkwait2:
    enabled: true
  poweroff:
    enabled: true
