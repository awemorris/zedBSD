version: 1
hostname: zedbsd

# WS035 p066: zdesktop (zdesktop --glass, Wiseman Mode) on the i915 passthrough of the 5330, on the
# capture display: the compositor, two wl_shm windows and the model viewer (mview --windowed, a
# Vulkan client whose images the compositor imports), all 800x560; the capture harness sends the
# input (plan/ws031/tests/vkloop-hw.sh zdesktop).
services:
  cron:
    enabled: false
  getty_console:
    enabled: true
  net:
    enabled: false
  networkd:
    enabled: false
  ntpdate:
    enabled: false
    settings:
      servers: ""
  syslogd:
    enabled: true
  vkwait1:
    enabled: true
  zdesktop:
    enabled: true
  wlwait:
    enabled: true
  wlshm2:
    enabled: true
  wlshm1:
    enabled: true
  mwait:
    enabled: true
  mwait2:
    enabled: true
  wlkill:
    enabled: true
  mview1:
    enabled: true
  vkwait2:
    enabled: true
  poweroff:
    enabled: true
