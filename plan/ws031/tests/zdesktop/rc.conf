version: 1
hostname: zedbsd

# WS035 p066: zdesktop (zwl --glass, Wiseman Mode) on the i915 passthrough of the 5330, on the
# capture display: the compositor and three wl_shm windows (a Vulkan client's buffer cannot be
# sampled by the compositor yet: the native executor has no sharing between contexts); the capture
# harness sends the input (plan/ws031/tests/vkloop-hw.sh zdesktop).
services:
  cron:
    enabled: false
  getty_console:
    enabled: true
  net:
    enabled: false
  networkd:
    enabled: false
  ntpdate:
    enabled: false
    settings:
      servers: ""
  syslogd:
    enabled: true
  vkwait1:
    enabled: true
  zwl:
    enabled: true
  wlwait:
    enabled: true
  wlshm2:
    enabled: true
  wlshm1:
    enabled: true
  mwait:
    enabled: true
  mwait2:
    enabled: true
  wlshm3:
    enabled: true
  vkwait2:
    enabled: true
  poweroff:
    enabled: true
