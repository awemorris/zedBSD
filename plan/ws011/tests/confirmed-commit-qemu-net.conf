# WS011 p007 synthetic QEMU startup intent.
version: 1

interfaces:
  lo0:
    type: loopback
    enabled: true
    ipv4:
      dhcp: false
      addresses:
        - address: 127.0.0.1
          prefix-length: 8
  ne0:
    type: ethernet
    enabled: true
    ipv4:
      dhcp: false
      addresses:
        - address: 10.0.2.15
          prefix-length: 24

routes:
  - destination: default
    gateway: 10.0.2.2

dns:
  mode: static
  servers:
    - 10.0.2.3
