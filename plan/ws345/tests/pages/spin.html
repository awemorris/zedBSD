<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>spin</title>
<style>
body { margin: 0; background: #e8f0e0; color: #1d3a24; font-family: sans-serif; font-size: 20px; }
h1 { margin: 0; padding: 24px; background: #3d8a4f; color: #ffffff; font-size: 28px; }
p { margin: 16px 24px; }
.band { height: 120px; margin: 16px 24px; background: linear-gradient(90deg, #30a0c0, #f0c030); }
</style>
</head>
<body>
<h1>A page whose script runs for 17 seconds</h1>
<p>A second after the load, a timer's script loops for 17 seconds without returning. After 10 seconds the
browser asks whether to wait for it or to stop it; a tick is written every half second while no script runs.</p>
<div class="band"></div>
<p id="state">The end of the page.</p>
<script>
var ticks = 0;
setInterval(function () {
	ticks++;
	console.log("tick " + ticks);
}, 500);
setTimeout(function () {
	var end = Date.now() + 17000;
	console.log("spin start");
	while (Date.now() < end) {
	}
	document.getElementById("state").textContent = "The script ended by itself.";
	console.log("spin end");
}, 1000);
</script>
</body>
</html>
