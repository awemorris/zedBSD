# ws291-p021: the Raspberry Pi 5 measurement image's network: the onboard Ethernet port (en0) by DHCP, so the board is
# reached over SSH from the host (found by its MAC on 10.0.30.0/24).
# Copyright (C) 2026 Awe Morris; SPDX-License-Identifier: Zlib
version: 1

interfaces:
  lo0:
    type: loopback
    enabled: true
    ipv4:
      dhcp: false
      addresses:
        - address: 127.0.0.1
          prefix-length: 8
  en0:
    type: ethernet
    enabled: true
    ipv4:
      dhcp: true
      dhcp-timeout: 30

dns:
  mode: dhcp
