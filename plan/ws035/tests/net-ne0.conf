# One wired interface addressed by the emulator's DHCP server, for the test.
version: 1

interfaces:
  lo0:
    type: loopback
    enabled: true
    ipv4:
      dhcp: false
      addresses:
        - address: 127.0.0.1
          prefix-length: 8
  ne0:
    type: ethernet
    enabled: true
    ipv4:
      dhcp: true
      dhcp-timeout: 20

dns:
  mode: dhcp
