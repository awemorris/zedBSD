version: 1
hostname: zedbsd

# WS035 p069: the zdesktop demo image for a real machine (plan/ws035/demo/build-demo-image.sh): the
# compositor in Wiseman Mode on the machine's own display, with App Home to start the terminal and the
# model viewer.  The console's login stays behind it.
services:
  cron:
    enabled: false
  getty_console:
    enabled: true
  net:
    enabled: false
  networkd:
    enabled: false
  ntpdate:
    enabled: false
    settings:
      servers: ""
  syslogd:
    enabled: true
  zdesktop:
    enabled: true
