## OpenSSL build target for llvm-mingw's aarch64-w64-mingw32 (OpenSSL 3.5.8 has mingw and mingw64
## only; its arm64 Windows targets are for MSVC's clang-cl).  Read through OPENSSL_LOCAL_CONFIG_DIR
## by plan/ws334/tests/openssl-windows.sh.  The compiler (and with it the architecture) comes from
## CC; there is no assembly for this target, so it is built with no-asm.
## Copyright (C) 2026 Awe Morris; SPDX-License-Identifier: Zlib

my %targets = (
    "mingw-arm64" => {
        inherit_from     => [ "mingw-common" ],
        sys_id           => "MINGW64",
        bn_ops           => add("SIXTY_FOUR_BIT"),
        asm_arch         => undef,
        uplink_arch      => undef,
        multilib         => "-arm64",
    },
);
