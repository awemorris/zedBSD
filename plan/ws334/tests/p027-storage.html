<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>p027 storage</title>
<style>
body { background: #ffffff; color: #102030; font-family: sans-serif; margin: 24px; }
h1 { font-size: 40px; margin: 0 0 16px 0; }
p { font-size: 32px; margin: 8px 0; }
.box { background: #2060c0; color: #ffffff; padding: 12px; }
</style>
</head>
<body>
<h1>localStorage</h1>
<p class="box" id="value">value: (script did not run)</p>
<p id="count">loads: ?</p>
<script>
/* The page's own value: written on the first load, read back on each later one; the count of loads goes up. */
var saved = localStorage.getItem("p027-value");
var loads = Number(localStorage.getItem("p027-loads") || "0") + 1;
if (saved === null) {
	localStorage.setItem("p027-value", "kept-27");
	document.getElementById("value").textContent = "value: none, wrote kept-27";
} else {
	document.getElementById("value").textContent = "value: " + saved;
}
localStorage.setItem("p027-loads", String(loads));
document.getElementById("count").textContent = "loads: " + loads;
document.title = "p027 " + (saved === null ? "none" : saved) + " loads=" + loads;
</script>
</body>
</html>
