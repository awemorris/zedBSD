# mikuterm's settings: one "Keyword value" a line, as ssh_config is written.
# A line mikuterm cannot use is named in the first tab and skipped.
# What the View menu chooses is kept in state.conf beside this file and wins
# over FontSize, Theme and AmbiguousWide here; remove state.conf to go back.

# The font of the grid and the one for what it has not (a .ttf or .ttc in
# fonts/ or share/fonts/, or a full path).
#Font keiland-mono.ttf
#FontFallback keiland-fallback.ttf

# The font's size in pixels at 96 dpi (8 to 32).
#FontSize 16

# The grid the window opens with.
#Columns 90
#Rows 28

# dark, light or contrast.
#Theme dark

# Characters of ambiguous width (Greek, Cyrillic, some signs) take two cells.
#AmbiguousWide no

# The TERM the remote side is told.
#Term xterm-256color

# The host the first tab connects to (a Host of ssh/config, or user@host:port).
# Without it, the tab lists ssh/config's hosts and asks.
#Connect server

# What the pointer selects is copied to the clipboard at once.
#CopyOnSelect yes

# How long a connection may take, in seconds (0: no limit).
#ConnectTimeout 15

# The port of the sshd in a WSL distribution chosen on a new tab's screen,
# when ssh/config has no "Host wsl-<name>" for it (22: sshd's own).
#WslPort 22
