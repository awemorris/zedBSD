# Phase 19 QEMU integration configuration.
hostname="zedbsd-phase19"
syslogd_enable=YES
getty_console_enable=NO
networkd_enable=YES
net_enable=YES
cron_enable=YES
ntpdate_enable=NO
phase19_smoke_enable=YES
net_auto="lo0"
net_dhcptimeout="10"
net_lo0="static ipv4 127.0.0.1 netmask 255.0.0.0"
ntpdate_servers=""
