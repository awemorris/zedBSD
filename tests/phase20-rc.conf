# Phase 20 QEMU integration configuration.
hostname="zedbsd-phase20"
syslogd_enable=YES
getty_console_enable=YES
networkd_enable=YES
net_enable=YES
cron_enable=YES
ntpdate_enable=NO
phase20_smoke_enable=YES
net_auto="lo0 ne0"
net_dhcptimeout="10"
net_lo0="static ipv4 127.0.0.1 netmask 255.0.0.0"
net_ne0="dhcp"
net_defaultroute="10.0.2.2"
net_dns="10.0.2.3 10.0.2.3"
ntpdate_servers=""
